name: Fork Sync

# GitHub Actions 的 cron 只能用 UTC，这里统一按北京时间换算与展示：
#   UTC 22:00 = 北京时间次日 06:00（TZ=Asia/Shanghai）
#   想改北京时间 HH:MM：UTC 小时 = HH - 8（HH < 8 时用前一天 24 + HH - 8）
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync_with_upstream:
    name: Merge Upstream (no force)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.repository.fork }}
    env:
      # 让所有 date / git 时间输出与运行摘要都使用北京时间
      TZ: Asia/Shanghai

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT != '' && secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Configure Git and remotes
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout main || git checkout -b main

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/imzyb/MiSub.git
          else
            git remote add upstream https://github.com/imzyb/MiSub.git
          fi

          if [ -n "${SYNC_PAT:-}" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${{ github.repository }}.git"
            echo "✅ 已检测到 SYNC_PAT，可同步 .github/workflows 变更。"
          else
            echo "ℹ️ 未配置 SYNC_PAT，使用默认 GITHUB_TOKEN（无法推送 workflow 文件变更）。"
          fi

          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Merge upstream main
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          SYNCED_AT="$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "🕗 同步时间（北京时间）：$SYNCED_AT"

          ORIGIN_SHA="$(git rev-parse origin/main)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          BEFORE_SHA="$(git rev-parse HEAD)"

          if [ "$ORIGIN_SHA" = "$UPSTREAM_SHA" ]; then
            echo "✨ Fork 已与上游完全一致，无需同步。"
            exit 0
          fi

          # GITHUB_TOKEN 不能创建或更新 workflow 文件。只看上游自上次分叉以来改了什么，
          # 免得 fork 自己定制过的 workflow 把每一次同步都挡掉。
          if [ -z "${SYNC_PAT:-}" ]; then
            MERGE_BASE="$(git merge-base "$ORIGIN_SHA" "$UPSTREAM_SHA" 2>/dev/null || true)"
            if [ -z "$MERGE_BASE" ]; then
              echo "::notice title=Fork Sync 已跳过::与上游没有共同历史，无法安全合并，请手动处理。"
              exit 0
            fi
            WORKFLOW_DIFF="$(git diff --name-only "$MERGE_BASE" "$UPSTREAM_SHA" -- .github/workflows || true)"
            if [ -n "$WORKFLOW_DIFF" ]; then
              echo "::notice title=Fork Sync 已跳过::上游本次改动包含 workflow 文件，默认 GITHUB_TOKEN 无权推送。请配置 secret SYNC_PAT（含 workflow 权限）后重跑，或在网页使用 Sync fork。"
              exit 0
            fi
          fi

          # 只做合并：合得进去就保留，合不进去就整体回滚，绝不重置分支或强推
          if ! git merge --no-edit upstream/main; then
            CONFLICTED="$(git diff --name-only --diff-filter=U || true)"
            if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
              git merge --abort
            fi
            if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
              echo "::error title=回滚失败::合并状态未能清除，请手动检查 fork 后再运行。"
              exit 1
            fi
            {
              echo "## ⚠️ 上游更新与本地修改冲突，本次未合并"
              echo ""
              echo "- 检查时间（北京时间）：${SYNCED_AT}"
              echo ""
              echo "已回滚到同步前的状态，fork 代码没有任何改动。冲突文件："
              echo ""
              echo '```'
              echo "$CONFLICTED"
              echo '```'
              echo ""
              echo "手动处理：\`git fetch upstream && git merge upstream/main\`，解决冲突后 \`git push origin main\`。"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
            echo "::warning title=合并冲突已跳过::${CONFLICTED:-unknown}"
            exit 0
          fi

          if [ "$(git rev-parse HEAD)" = "$BEFORE_SHA" ]; then
            echo "✨ 本地已包含上游全部提交，无需推送。"
            exit 0
          fi

          # 普通推送；被拒绝时宁可失败，也不覆盖远端
          git push origin HEAD:main
          echo "✅ 已合并上游更新并推送，fork 本地提交保持原样。"

          {
            echo "## ✅ 已同步上游"
            echo ""
            echo "- 同步时间（北京时间）：${SYNCED_AT}"
            echo "- 合并后提交：\`$(git rev-parse --short HEAD)\`"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
